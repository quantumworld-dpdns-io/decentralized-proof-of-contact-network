name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python lint dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
        continue-on-error: true
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ESLint check
        working-directory: dashboard
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts 2>/dev/null || true
            npx eslint . --ext .ts,.tsx 2>/dev/null || echo "ESLint not configured, skipping"
          fi
        continue-on-error: true

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build workspace (debug)
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: Build workspace (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Build Python bindings
        run: |
          pip install maturin
          maturin build --release 2>/dev/null || echo "Maturin build skipped"
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run cargo tests
        run: cargo test --workspace --all-targets
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: |
          pip install maturin pytest pytest-asyncio
          pip install -e ".[test,dev]" 2>/dev/null || true
      - name: Run Python tests
        run: pytest python-client/ tests/ -v --tb=short 2>/dev/null || echo "No Python tests found"
        continue-on-error: true
      - name: Run Robot Framework tests
        run: |
          pip install robotframework robotframework-requests
          make test-robot 2>/dev/null || echo "Robot tests not configured"
        continue-on-error: true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate Rust coverage
        run: cargo tarpaulin --workspace --out Xml --out Html --output-dir coverage
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python coverage tool
        run: pip install coverage
      - name: Generate Python coverage
        run: |
          coverage run -m pytest 2>/dev/null || true
          coverage xml -o coverage/coverage-python.xml 2>/dev/null || true
        continue-on-error: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: rust,python
          fail_ci_if_error: false
          verbose: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-audit
        run: cargo audit
        continue-on-error: true
      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node.Dockerfile
          load: true
          tags: poi-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          load: true
          tags: poi-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan node image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: poi-node:ci
          format: sarif
          output: trivy-docker.sarif
          severity: HIGH,CRITICAL
        continue-on-error: true

  integration:
    name: Integration Tests
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start integration environment
        run: docker compose -f docker/docker-compose.yml up -d --wait
        env:
          COMPOSE_PROFILES: integration
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done
      - name: Run integration tests
        run: cargo test --workspace -- --ignored --test-threads=4
        env:
          POI_NODE_URL: http://localhost:3000
          POI_API_KEY: test-key
      - name: Run Robot integration tests
        run: |
          pip install robotframework robotframework-requests
          make test-robot-all
        continue-on-error: true
        env:
          NODE_URL: http://localhost:3000
      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
