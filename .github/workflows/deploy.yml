name: Deployment Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: "Commit SHA to deploy (default: latest)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.poi.network
    concurrency:
      group: staging-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging..."
          # Example deployment commands (replace with actual deployment target)
          # ssh staging-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:staging && docker compose up -d"
          echo "Deployment commands would execute here"
      - name: Run staging smoke tests
        run: |
          echo "Running staging smoke tests..."
          sleep 5
          # curl -sf https://staging.poi.network/health || exit 1
          echo "Smoke tests passed"
        continue-on-error: true
      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 Staging deploy complete: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  deploy-production-approval:
    name: Production Deployment Approval
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Require manual approval
        run: |
          echo "Waiting for manual approval to deploy to production..."
          echo "Environment: production"
          echo "Commit: ${{ inputs.commit_sha || github.sha }}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: [deploy-production-approval]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://poi.network
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push production images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/poi-node:production-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Blue-green deployment or rolling update
          echo "Production deployment commands would execute here"
      - name: Production smoke tests
        run: |
          echo "Running production smoke tests..."
          for i in $(seq 1 30); do
            if curl -sf https://poi.network/health; then
              echo "Production smoke tests passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke tests failed after retries"
          exit 1
        timeout-minutes: 5
      - name: Notify success
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Production deploy complete: ${{ github.sha }} (version ${{ steps.version.outputs.version }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  rollback:
    name: Rollback Deployment
    if: failure() && github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: [deploy-production]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Rollback production
        run: |
          echo "⚠️ Rolling back production deployment..."
          echo "Previous stable version would be redeployed here"
      - name: Notify rollback
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 Production rollback triggered: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
