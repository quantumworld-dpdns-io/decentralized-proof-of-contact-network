# Full stack deployment for POI Network
# Usage: docker compose -f docker/docker-compose.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-health-check: &health-check
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

networks:
  poi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  poi-data:
  chromadb-data:
  qdrant-data:
  duckdb-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  minio-data:

services:
  # === POI Node (Multi-Node Cluster) ===
  poi-node-1:
    image: ghcr.io/quantumworld-dpdns-io/decentralized-proof-of-contact-network/poi-node:latest
    build:
      context: ..
      dockerfile: docker/node.Dockerfile
    container_name: poi-node-1
    networks:
      poi-network:
        ipv4_address: 172.20.0.10
    ports:
      - "3001:3000"  # API (mapped to avoid conflict)
      - "9090"       # P2P
      - "9091"       # Metrics
    volumes:
      - poi-data:/var/lib/poi
      - ./config.prod.toml:/etc/poi/config.toml:ro
    environment:
      NODE_ID: "node-1"
      EXTERNAL_ADDR: "poi-node-1:9090"
      VECTOR_DB_PROVIDER: "chromadb"
      VECTOR_DB_HOST: "chromadb:8000"
      VECTOR_DB_PORT: 8000
      VECTOR_DB_API_KEY: ""
      AI_PROVIDER: "ollama"
      AI_MODEL: "llama3"
      EMBEDDING_MODEL: "nomic-embed-text"
      AI_ENDPOINT: "http://ollama:11434"
      AI_API_KEY: ""
      DASHBOARD_URL: "http://localhost:3000"
      OTLP_ENDPOINT: "http://otel-collector:4317"
      RUST_LOG: "info"
    depends_on:
      chromadb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck: *health-check
    logging: *default-logging
    restart: unless-stopped

  poi-node-2:
    image: ghcr.io/quantumworld-dpdns-io/decentralized-proof-of-contact-network/poi-node:latest
    build:
      context: ..
      dockerfile: docker/node.Dockerfile
    container_name: poi-node-2
    networks:
      poi-network:
        ipv4_address: 172.20.0.11
    ports:
      - "3002:3000"
      - "9090"
      - "9091"
    volumes:
      - poi-data:/var/lib/poi
      - ./config.prod.toml:/etc/poi/config.toml:ro
    environment:
      NODE_ID: "node-2"
      EXTERNAL_ADDR: "poi-node-2:9090"
      VECTOR_DB_PROVIDER: "chromadb"
      VECTOR_DB_HOST: "chromadb:8000"
      VECTOR_DB_PORT: 8000
      VECTOR_DB_API_KEY: ""
      AI_PROVIDER: "ollama"
      AI_MODEL: "llama3"
      EMBEDDING_MODEL: "nomic-embed-text"
      AI_ENDPOINT: "http://ollama:11434"
      AI_API_KEY: ""
      DASHBOARD_URL: "http://localhost:3000"
      OTLP_ENDPOINT: "http://otel-collector:4317"
      RUST_LOG: "info"
    depends_on:
      chromadb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck: *health-check
    logging: *default-logging
    restart: unless-stopped

  poi-node-3:
    image: ghcr.io/quantumworld-dpdns-io/decentralized-proof-of-contact-network/poi-node:latest
    build:
      context: ..
      dockerfile: docker/node.Dockerfile
    container_name: poi-node-3
    networks:
      poi-network:
        ipv4_address: 172.20.0.12
    ports:
      - "3003:3000"
      - "9090"
      - "9091"
    volumes:
      - poi-data:/var/lib/poi
      - ./config.prod.toml:/etc/poi/config.toml:ro
    environment:
      NODE_ID: "node-3"
      EXTERNAL_ADDR: "poi-node-3:9090"
      VECTOR_DB_PROVIDER: "chromadb"
      VECTOR_DB_HOST: "chromadb:8000"
      VECTOR_DB_PORT: 8000
      VECTOR_DB_API_KEY: ""
      AI_PROVIDER: "ollama"
      AI_MODEL: "llama3"
      EMBEDDING_MODEL: "nomic-embed-text"
      AI_ENDPOINT: "http://ollama:11434"
      AI_API_KEY: ""
      DASHBOARD_URL: "http://localhost:3000"
      OTLP_ENDPOINT: "http://otel-collector:4317"
      RUST_LOG: "info"
    depends_on:
      chromadb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck: *health-check
    logging: *default-logging
    restart: unless-stopped

  # === Vector Databases ===
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    networks:
      poi-network:
        ipv4_address: 172.20.0.20
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    networks:
      poi-network:
        ipv4_address: 172.20.0.21
    ports:
      - "6333:6333"  # gRPC
      - "6334:6334"  # REST
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6333
      QDRANT__SERVICE__HTTP_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6334/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # === Local Analytics Database ===
  duckdb:
    image: dltdata/duckdb:latest
    container_name: duckdb
    networks:
      poi-network:
        ipv4_address: 172.20.0.22
    ports:
      - "4219:4219"
    volumes:
      - duckdb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "duckdb -c 'SELECT 1'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - analytics
      - full

  # === AI / LLM Services ===
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      poi-network:
        ipv4_address: 172.20.0.30
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # === Monitoring Stack ===
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      poi-network:
        ipv4_address: 172.20.0.40
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      poi-network:
        ipv4_address: 172.20.0.41
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # === Dashboard (Next.js) ===
  dashboard:
    image: ghcr.io/quantumworld-dpdns-io/decentralized-proof-of-contact-network/dashboard:latest
    container_name: dashboard
    networks:
      poi-network:
        ipv4_address: 172.20.0.50
    ports:
      - "3000:3000"
    build:
      context: ../dashboard
      dockerfile: ../docker/dashboard.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:9090
    environment:
      NEXT_PUBLIC_API_URL: http://poi-node-1:3000
      NEXT_PUBLIC_WS_URL: ws://poi-node-1:9090
    depends_on:
      - poi-node-1
    logging: *default-logging
    restart: unless-stopped
