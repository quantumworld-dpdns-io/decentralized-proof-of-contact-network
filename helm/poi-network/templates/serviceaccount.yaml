{{- range $component, $saConfig := .Values.serviceAccounts }}
{{- if $saConfig.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "poi-network.serviceAccountName" (dict "component" $component "context" $) }}
  namespace: {{ include "poi-network.namespace" $ }}
  labels:
    {{- include "poi-network.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $saConfig.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poi-network.fullname" . }}-pod-reader
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poi-network.fullname" . }}-pod-reader
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "poi-network.fullname" . }}-pod-reader
subjects:
  {{- range $component, $saConfig := $.Values.serviceAccounts }}
  {{- if $saConfig.create }}
  - kind: ServiceAccount
    name: {{ include "poi-network.serviceAccountName" (dict "component" $component "context" $) }}
    namespace: {{ include "poi-network.namespace" $ }}
  {{- end }}
  {{- end }}
