{{- if .Values.node.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "poi-network.fullname" . }}-node-pdb
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  minAvailable: {{ .Values.node.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "poi-network.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
{{- end }}

