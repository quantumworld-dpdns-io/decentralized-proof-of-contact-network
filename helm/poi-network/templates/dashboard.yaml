{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poi-network.fullname" . }}-dashboard
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  strategy:
    type: {{ .Values.dashboard.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.dashboard.strategy.maxSurge }}
      maxUnavailable: {{ .Values.dashboard.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "poi-network.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "poi-network.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "poi-network.serviceAccountName" (dict "component" "dashboard" "context" $) }}
      securityContext:
        fsGroup: {{ .Values.dashboard.securityContext.fsGroup }}
        runAsUser: {{ .Values.dashboard.securityContext.runAsUser }}
        runAsNonRoot: {{ .Values.dashboard.securityContext.runAsNonRoot }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.dashboard.terminationGracePeriodSeconds }}
      containers:
        - name: dashboard
          image: {{ include "poi-network.image" (dict "image" .Values.dashboard.image "global" .Values.global "chartVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "poi-network.imagePullPolicy" (dict "image" .Values.dashboard.image "global" .Values.global) }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            {{- include "poi-network.env" (dict "env" .Values.dashboard.env) | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: {{ .Values.dashboard.securityContext.runAsUser }}
            runAsGroup: {{ .Values.dashboard.securityContext.runAsGroup }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poi-network.fullname" . }}-dashboard
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "poi-network.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
