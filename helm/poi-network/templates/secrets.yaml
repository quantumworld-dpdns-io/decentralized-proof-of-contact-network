{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poi-network.fullname" . }}-secrets
  namespace: {{ include "poi-network.namespace" . }}
  labels:
    {{- include "poi-network.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  VECTOR_DB_API_KEY: {{ .Values.secrets.vectorDbApiKey | default "" | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | default "" | quote }}
  tls.crt: {{ .Values.secrets.tlsCrt | default "" | quote }}
  tls.key: {{ .Values.secrets.tlsKey | default "" | quote }}
  peer-identity-key: {{ .Values.secrets.peerIdentityKey | default "" | quote }}
  peer-identity-public: {{ .Values.secrets.peerIdentityPublic | default "" | quote }}
  DB_USER: {{ .Values.secrets.dbUser | default "poi" | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default "" | quote }}
  DB_HOST: {{ .Values.secrets.dbHost | default "" | quote }}
  DB_PORT: {{ .Values.secrets.dbPort | default "5432" | quote }}
  DB_NAME: {{ .Values.secrets.dbName | default "poinetwork" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | default "" | quote }}
  ANALYTICS_BUCKET: {{ .Values.secrets.analyticsBucket | default "poi-analytics" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "" | quote }}
  API_KEY: {{ .Values.secrets.apiKey | default "" | quote }}
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | default "admin" | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | default "" | quote }}
{{- end }}
