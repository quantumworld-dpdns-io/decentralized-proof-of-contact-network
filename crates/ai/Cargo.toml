[package]
name = "poi-ai"
version = "0.1.0"
edition = "2021"
description = "AI/ML integration for decentralized proof-of-contact network"

[dependencies]
poi-core = { path = "../core" }
poi-vector-store = { path = "../vector-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["ollama"]
ollama = []
lm-studio = []
vllm = []
sglang = []
llamacpp = []
