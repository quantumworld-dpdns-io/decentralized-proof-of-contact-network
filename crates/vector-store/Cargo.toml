[package]
name = "poi-vector-store"
version = "0.1.0"
edition = "2021"
description = "Vector database integration layer for proof-of-contact network"

[dependencies]
poi-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["chroma", "qdrant"]
chroma = []
qdrant = []
weaviate = []
lancedb = []
milvus = []
