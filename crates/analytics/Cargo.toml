[package]
name = "poi-analytics"
version = "0.1.0"
edition = "2021"
description = "Data lakehouse and analytics engine for proof-of-contact network"

[dependencies]
poi-core = { path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }

duckdb = { version = "1.1", optional = true, features = ["bundled"] }
arrow = { version = "53", optional = true, features = ["ipc", "json", "ffi"] }
parquet = { version = "53", optional = true }
datafusion = { version = "46", optional = true }
iceberg = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["duckdb", "arrow"]
duckdb = ["dep:duckdb", "arrow"]
arrow = ["dep:arrow", "dep:parquet"]
datafusion = ["dep:datafusion", "arrow"]
iceberg = ["dep:iceberg", "arrow"]
trino = []
