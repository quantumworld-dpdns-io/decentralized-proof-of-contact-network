[package]
name = "poi-analytics"
version = "0.1.0"
edition = "2021"
description = "Data lakehouse and analytics engine for proof-of-contact network"

[dependencies]
poi-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["duckdb", "arrow"]
duckdb = ["dep:duckdb"]
arrow = ["dep:arrow"]
datafusion = ["dep:datafusion"]
iceberg = ["dep:iceberg"]
trino = []
