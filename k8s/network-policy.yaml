            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
  egress:
    - ports:
        - port: 80
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
    - ports:
        - port: 8000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chromadb
    - ports:
        - port: 11434
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
