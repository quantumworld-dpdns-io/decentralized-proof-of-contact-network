apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poi-api-hpa
  namespace: poi-network
  labels:
    app.kubernetes.io/name: poi-network
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: decentralized-proof-of-contact-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poi-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
