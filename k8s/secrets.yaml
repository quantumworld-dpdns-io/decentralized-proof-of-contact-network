apiVersion: v1
kind: Secret
metadata:
  name: poi-secrets
  namespace: poi-network
  labels:
    app.kubernetes.io/name: poi-network
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Vector Database Credentials
  VECTOR_DB_API_KEY: ""                      # Set via external secrets manager

  # AI Provider Credentials
  AI_API_KEY: ""                             # Set via external secrets manager

  # TLS Certificates
  tls.crt: ""                                # TLS certificate (base64)
  tls.key: ""                                # TLS private key (base64)

  # Peer Identity Keys
  peer-identity-key: ""                      # Ed25519 private key for peer identity
  peer-identity-public: ""                   # Ed25519 public key for peer identity

  # Database Credentials
  DB_USER: "poi"
  DB_PASSWORD: ""                            # Set via external secrets manager
  DB_HOST: "poi-metadata.cluster-xxxxxxxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "poinetwork"

  # Redis Cache
  REDIS_PASSWORD: ""                         # Set via external secrets manager

  # S3 / Analytics
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  ANALYTICS_BUCKET: "poi-analytics"

  # JWT / API Auth
  JWT_SECRET: ""                             # Set via external secrets manager
  API_KEY: ""                                # Set via external secrets manager

  # Grafana
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: ""                 # Set via external secrets manager
---
apiVersion: v1
kind: Secret
metadata:
  name: poi-registry-credentials
  namespace: poi-network
  labels:
    app.kubernetes.io/name: poi-network
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""                      # Container registry auth (base64)
