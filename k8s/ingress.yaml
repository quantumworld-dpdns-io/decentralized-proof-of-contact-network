apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poi-ingress
  namespace: poi-network
  labels:
    app.kubernetes.io/name: poi-network
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: decentralized-proof-of-contact-network
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.poi.network
        - dashboard.poi.network
        - mcp.poi.network
      secretName: poi-tls
  rules:
    - host: api.poi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poi-api
                port:
                  number: 80
    - host: dashboard.poi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poi-dashboard
                port:
                  number: 80
    - host: mcp.poi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poi-mcp-server
                port:
                  number: 80
    - host: poi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poi-dashboard
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: poi-network
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@poi.network
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
