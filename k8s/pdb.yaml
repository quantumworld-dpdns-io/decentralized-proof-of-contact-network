apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: poi-node-pdb
  namespace: poi-network
  labels:
    app.kubernetes.io/name: poi-network
    app.kubernetes.io/component: node
    app.kubernetes.io/part-of: decentralized-proof-of-contact-network
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: poi-network
      app.kubernetes.io/component: node
