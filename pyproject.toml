[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "poi-core"
description = "Decentralized Proof-of-Contact Network - Python bindings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "quantumworld-dpdns-io" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
]
ai = [
    "openai>=1.0",
    "ragas>=0.1",
]
analytics = [
    "duckdb>=1.0",
    "pyarrow>=17",
    "pandas>=2.0",
]
test = [
    "robotframework>=7.0",
    "robotframework-requests>=0.9",
    "robotframework-seleniumlibrary>=6.3",
    "locust>=2.30",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "poi_core._native"
