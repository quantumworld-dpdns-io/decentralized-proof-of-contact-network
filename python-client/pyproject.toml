[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-client"
version = "0.1.0"
description = "Python SDK for Decentralized Proof-of-Contact Network"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
poi = "poi.__main__:main"
